function tbl(){const q=v('q').toLowerCase(),s=v('sx'),L=DB.p.filter(p=>(!s||p.sx===s)&&(p.nom+' '+p.pre+' '+p.id).toLowerCase().includes(q));

 T='pat';render();M(`Dossier créé : <b>${id}</b> · mot de passe initial : <b>${pw}</b><br><small>À remettre au patient en main propre. Il ne sera plus affiché.</small>`,'o')}

function addPr(){const n=v('pn').trim(),q=parseInt(v('pq'),10),s=parseInt(v('ps'),10);if(!n||!(q>=0)||!(s>=0)||!v('pe'))return M('Libellé, quantité, seuil et date de péremption sont obligatoires.','e');DB.pr.push({n,d:n,f:'',c:v('pc'),k:v('pk'),q,s,e:v('pe'),fo:'',a:true});lg('Produit ajouté : '+n);render();M('Produit ajouté.','o')}

 return`<p>L’administrateur définit ici les examens et les forfaits proposés aux soignants, avec leurs tarifs en FCFA. Un élément retiré n’est plus proposé, mais reste visible dans les dossiers existants.</p><h2>Forfaits (bilans)</h2><div class="ov"><table><tr><th>Forfait et composition</th><th>Tarif (FCFA)</th><th>Actions</th></tr>${pk}</table></div><h3>Créer un forfait</h3><div class="c"><div class="f">${F('fn','Nom du forfait *')}${F('ft','Tarif (FCFA) *','number','min="0"')}</div><label>Examens du forfait</label><div style="max-height:160px;overflow:auto">${DB.ex.filter(x=>x.a).map(x=>`<label style="display:inline-block;margin-right:12px"><input type="checkbox" class="fi" value="${x.c}" style="width:auto"> ${esc(x.n)}</label>`).join('')}</div><p><button class="b" onclick="addPk()">Créer le forfait</button></p></div><h2>Catalogue des examens</h2>${ex}<h3>Ajouter un examen</h3><div class="c"><div class="f">${F('en','Nom de l’examen *')}${F('ek','Catégorie *','text','list="cl"')}<datalist id="cl">${cats.map(k=>`<option value="${esc(k)}">`).join('')}</datalist>${F('et','Tarif (FCFA)','number','min="0"')}</div><p><button class="b" onclick="addE()">Ajouter l’examen</button></p></div><h3>Importer une liste</h3><div class="c"><label>Une ligne par examen : catégorie;examen;tarif<textarea id="eimp" rows="4"></textarea></label><p><button class="b s" onclick="impE()">Importer</button></p></div>`}

<h2>Groupe sanguin et interdits alimentaires</h2><div class="c"><div class="f">${SL('gs','Groupe sanguin',GS).replace(`value="${p.gs}"`,`value="${p.gs}" selected`)}${F('ib','Interdits alimentaires (séparés par des virgules)','text',`value="${esc(p.ib.join(', '))}"`)}</div><p><button class="b s" onclick="saveI()">Enregistrer</button></p></div>
<h2>Nouvelle consultation</h2><div class="c"><div class="f">${F('mo','Motif *')}${F('w','Poids (kg) *','number','step="0.1"')}${F('h','Taille (cm) *','number')}${F('sy','Tension systolique (mmHg) *','number')}${F('di','Tension diastolique (mmHg) *','number')}${F('pu','Pouls (batt./min) *','number')}${SL('fa','Niveau d’activité',FA.map(x=>[x[0],x[1]]))}</div>
<label>Note clinique (réservée aux soignants)<textarea id="no" rows="2"></textarea></label><label>Conseils pour le patient<textarea id="cs" rows="2"></textarea></label><label>Suspicion de maladie (hypothèse du soignant, non publiée)<input id="su"></label>
<h3>Pharmacie – prescription</h3>${[0,1,2].map(i=>`<div class="f"><label>Médicament ${i+1}<select id="rm${i}"><option value="">—</option>${DB.pr.filter(x=>x.k==='Médicament'&&x.a).map(x=>`<option value="${esc(x.n)}">${esc(x.n)}</option>`).join('')}</select></label>${F('rp'+i,'Posologie')}${F('rd'+i,'Durée')}</div>`).join('')}
<h3>Laboratoire – forfaits et examens</h3><p>${DB.pk.filter(p=>p.a).map(p=>`<label style="display:inline-block;margin-right:14px"><input type="checkbox" class="fo" value="${p.id}" style="width:auto"> <b>${esc(p.n)}</b></label>`).join('')}</p>${[...new Set(DB.ex.filter(x=>x.a).map(x=>x.k))].map(k=>`<details><summary>${esc(k)}</summary>${DB.ex.filter(x=>x.k===k&&x.a).map(x=>`<label style="display:inline-block;margin-right:12px"><input type="checkbox" class="ex" value="${x.c}" style="width:auto"> ${esc(x.n)}</label>`).join('')}</details>`).join('')}
<label><input type="checkbox" id="pb" style="width:auto"> Publier au patient dès l’enregistrement</label><p><button class="b" onclick="saveC()">Enregistrer la consultation</button></p></div>
<h2>Historique</h2>${p.c.map((c,i)=>`<div class="c" style="margin-bottom:8px"><b>${c.d}</b> – ${esc(c.mo)} <span class="tg">${c.pub?'publié':'non publié'}</span> <small>${esc(c.by)}</small><br>Poids ${c.w} kg · Taille ${c.h} cm · TA ${c.sy}/${c.di} · Pouls ${c.pu}<br>${c.note?'Note : '+esc(c.note)+'<br>':''}${c.su?'Suspicion : '+esc(c.su)+'<br>':''}${c.rx.map(r=>'Prescription : '+esc(r.m)+' – '+esc(r.po)+' – '+esc(r.du)+'<br>').join('')}${(c.fo||[]).length?'Forfait : '+c.fo.map(f=>esc((DB.pk.find(z=>z.id===f.id)||{n:f.id}).n)).join(', ')+'<br>':''}${c.ex.map((e,j)=>`Examen ${EX.find(z=>z[0]===e.c)[1]} : ${e.r?esc(e.r):`<input id="r${i}_${j}" placeholder="Résultat" style="width:140px"> <button class="b s" onclick="res(${i},${j})">Saisir</button>`}<br>`).join('')}<button class="b s" onclick="pubT(${i})">${c.pub?'Retirer la publication':'Publier au patient'}</button></div>`).join('')||'<p>Aucune consultation enregistrée.</p>'}`}
 return`<main class="w"><h1>Équipe de soins</h1><label>Patient<select onchange="sel=this.value;render()"><option value="">Choisir un patient</option>${o}</select></label><div id="msg"></div>${b}<h2>Pharmacie</h2><details><summary>Voir la disponibilité des produits</summary><div class="ov"><table><tr><th>Produit</th><th>Stock</th><th>Péremption</th></tr>${DB.pr.filter(x=>x.a).map(x=>`<tr><td>${esc(x.n)}</td><td>${x.q}${x.q<=x.s?' <span class="al">stock bas</span>':''}</td><td>${x.e}</td></tr>`).join('')}</table></div></details></main>`}
function saveC(){const p=P(sel),w=+v('w'),h=+v('h'),sy=+v('sy'),di=+v('di'),pu=+v('pu');
 if(!v('mo').trim())return M('Le motif est obligatoire.','e');if(!(w>=.5&&w<=300))return M('Poids incohérent : saisissez une valeur entre 0,5 et 300 kg.','e');if(!(h>=30&&h<=250))return M('Taille incohérente : saisissez une valeur entre 30 et 250 cm.','e');
 if(!(di>0&&sy>di))return M('La tension systolique doit être supérieure à la diastolique.','e');if(!(pu>=20&&pu<=250))return M('Pouls incohérent : plage de démonstration de 20 à 250.','e');
 const fo=[...document.querySelectorAll('.fo:checked')].map(x=>DB.pk.find(p=>p.id===x.value)),ex=[];fo.forEach(p=>p.it.forEach(c=>{if(!ex.some(e=>e.c===c))ex.push({c,r:'',paid:false,pk:p.id})}));document.querySelectorAll('.ex:checked').forEach(x=>{if(!ex.some(e=>e.c===x.value))ex.push({c:x.value,r:'',paid:false})});
 const rx=[0,1,2].map(i=>({m:v('rm'+i),po:v('rp'+i),du:v('rd'+i)})).filter(r=>r.m);if(rx.some(r=>!r.po.trim()))return M('Indiquez la posologie de chaque médicament prescrit.','e');
 p.c.unshift({d:today(),by:S.name,mo:v('mo').trim(),w,h,sy,di,pu,fa:v('fa'),note:v('no'),cs:v('cs'),su:v('su'),rx,ex,fo:fo.map(x=>({id:x.id,paid:false})),pub:$('pb').checked});lg('Consultation enregistrée pour '+p.id);render();M('Consultation enregistrée.','o')}
function saveI(){const p=P(sel);p.gs=v('gs');p.ib=v('ib').split(',').map(x=>x.trim()).filter(Boolean);lg('Profil mis à jour : '+p.id);render();M('Profil mis à jour.','o')}
function res(i,j){const r=v('r'+i+'_'+j).trim();if(!r)return M('Saisissez un résultat.','e');P(sel).c[i].ex[j].r=r;lg('Résultat saisi : '+sel);render()}
function pubT(i){const c=P(sel).c[i];c.pub=!c.pub;lg((c.pub?'Publication':'Retrait de publication')+' : '+sel);render()}
/* Patient */
function PatV(){const p=P(S.id),L=p.c.filter(c=>c.pub),c=L[0];
 return`<main class="w"><h1>Mon carnet électronique</h1><p>Identifiant : <b>${p.id}</b> · ${age(p.nai)} · ${p.sx==='F'?'Féminin':'Masculin'} · Groupe sanguin : ${p.gs||'non renseigné'}</p>
<div class="c">${ind(p,c)}<p>${p.ib.length?'Interdits alimentaires : <b>'+p.ib.map(esc).join(', ')+'</b>':'Aucun interdit alimentaire enregistré.'}</p></div>
<h2>Historique des traitements</h2><div class="c">${L.flatMap(x=>x.rx.map(r=>`<p>${x.d} – ${esc(r.m)}, ${esc(r.po)}, ${esc(r.du)} <small>(${esc(x.by)})</small></p>`)).join('')||'Aucun traitement publié.'}</div>
<h2>Fichier d’analyses</h2><div class="c">${L.flatMap(x=>x.ex.map(e=>`<p>${x.d} – ${EX.find(z=>z[0]===e.c)[1]} : ${e.r?'<b>'+esc(e.r)+'</b>':'<span class="tg">en attente de résultat</span>'}</p>`)).join('')||'Aucune analyse publiée.'}</div>
<h2>Fiches de suivi</h2><div class="c">${L.map(x=>`<p>${x.d} – ${esc(x.mo)}<br>Conseils : ${esc(x.cs)||'—'}</p>`).join('')||'Aucune fiche publiée. Un élément en attente de validation n’est pas visible ici.'}</div>
<h2>Connaissance sanitaire</h2><div class="c"><details><summary>Manger varié</summary><p>Associez légumes, fruits, légumineuses et céréales. Contenu de démonstration, à rédiger et valider par le CMSB.</p></details><details><summary>Se laver les mains</summary><p>Avant les repas et après les toilettes. Contenu de démonstration.</p></details></div>
<h2>Boîte de suggestion</h2><div class="c">${SL('sk','Catégorie',['Accueil','Délais d’attente','Soins','Propreté','Plateforme','Autre'])}<label>Votre message (1 000 caractères au plus)<textarea id="st" rows="3" maxlength="1000"></textarea></label><p><button class="b" onclick="sug()">Envoyer la suggestion</button></p><div id="msg"></div><small>Cet espace n’est pas un service d’urgence. En cas d’urgence médicale, contactez directement un professionnel ou les urgences.</small></div></main>`}
function sug(){const t=v('st').trim();if(!t)return M('Écrivez votre message avant l’envoi.','e');DB.sug.unshift({k:v('sk'),t,d:new Date().toLocaleString('fr-FR')});lg('Suggestion envoyée');$('st').value='';M('Suggestion envoyée. Merci pour votre retour.','o')}
render();
</script></body></html>
